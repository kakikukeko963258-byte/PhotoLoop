name: PhotoLoop
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: com.studyquiz.dailyquiz
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
targets:
  PhotoLoop:
    type: application
    platform: iOS
    sources:
      - path: PhotoLoop
    info:
      path: PhotoLoop/Info.plist
      properties:
        CFBundleDisplayName: 写真リスニング
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
schemes:
  PhotoLoop:
    build:
      targets:
        PhotoLoop: all
